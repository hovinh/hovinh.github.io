<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="630" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">The four ends: what's mandatory vs. free to skip</text>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <rect x="110" y="44" width="18" height="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="134" y="57">mandatory &#8212; must align, gaps penalized</text>
    <rect x="470" y="44" width="18" height="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="494" y="57">free end &#8212; skippable, no penalty</text>
    <rect x="110" y="70" width="18" height="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="134" y="83">excluded &#8212; not part of the alignment at all</text>
    <rect x="470" y="70" width="18" height="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="494" y="83">matched core / island</text>
  </g>

  <!-- ============ GLOBAL (top=110) ============ -->
  <text x="60" y="128" font-size="14" font-weight="700" fill="#111827">Global</text>
  <text x="60" y="146" font-size="11" fill="#6b7280">first</text>
  <rect x="110" y="134" width="640" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="182" font-size="11" fill="#6b7280">second</text>
  <rect x="110" y="170" width="640" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="110" y="212" font-size="12" font-style="italic" fill="#6b7280">Both sequences fully, mandatorily aligned end to end &#8212; no free ends anywhere.</text>

  <!-- ============ OVERLAP (top=235) ============ -->
  <text x="60" y="253" font-size="14" font-weight="700" fill="#111827">Overlap</text>
  <text x="60" y="271" font-size="11" fill="#6b7280">first</text>
  <rect x="110" y="259" width="180" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="290" y="259" width="300" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="307" font-size="11" fill="#6b7280">second</text>
  <rect x="290" y="295" width="300" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="590" y="295" width="180" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="290" y1="281" x2="290" y2="295" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="590" y1="281" x2="590" y2="295" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="440" y="292" text-anchor="middle" font-size="10" fill="#0d9488">overlap</text>
  <text x="110" y="337" font-size="12" font-style="italic" fill="#6b7280">A suffix of first meets a prefix of second &#8212; free before/after, mandatory once they overlap.</text>

  <!-- ============ SEMIGLOBAL (top=360) ============ -->
  <text x="60" y="378" font-size="14" font-weight="700" fill="#111827">Semiglobal</text>
  <text x="60" y="396" font-size="11" fill="#6b7280">first</text>
  <rect x="110" y="384" width="90" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="200" y="384" width="460" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="660" y="384" width="90" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="60" y="432" font-size="11" fill="#6b7280">second</text>
  <rect x="110" y="420" width="90" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="200" y="420" width="460" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="660" y="420" width="90" height="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="110" y="462" font-size="12" font-style="italic" fill="#6b7280">Leading/trailing gaps free on both strings &#8212; containment or overhang, either direction.</text>

  <!-- ============ LOCAL (top=485) ============ -->
  <text x="60" y="503" font-size="14" font-weight="700" fill="#111827">Local</text>
  <text x="60" y="521" font-size="11" fill="#6b7280">first</text>
  <rect x="110" y="509" width="230" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="340" y="509" width="130" height="22" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="470" y="509" width="280" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="557" font-size="11" fill="#6b7280">second</text>
  <rect x="110" y="545" width="230" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="340" y="545" width="130" height="22" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="470" y="545" width="280" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="340" y1="531" x2="340" y2="545" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="470" y1="531" x2="470" y2="545" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="110" y="587" font-size="12" font-style="italic" fill="#6b7280">Best-scoring island anywhere &#8212; everything outside is discarded, not just unpenalized.</text>
</svg>
