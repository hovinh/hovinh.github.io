<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="384" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#111827">The model only writes a note</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">A tool call is a note written as text. The model asks, the API delivers, and our code is the only place anything runs.</text>
  <rect x="24" y="80" width="300" height="280" rx="12" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/>
  <text x="44" y="106" font-size="15" fill="#b45309" font-weight="700">The model</text>
  <text x="44" y="125" font-size="12" fill="#6b7280">can only write text</text>
  <path d="M40,142 L292,142 L308,158 L308,262 L40,262 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M292,142 L292,158 L308,158" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="166" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">tool_calls: [{</text>
  <text x="52" y="182" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">  id: &quot;call_0&quot;,</text>
  <text x="52" y="198" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">  name: &quot;solve_with_shortcut&quot;,</text>
  <text x="52" y="214" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">  arguments:</text>
  <text x="52" y="230" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">   &#x27;{&quot;a&quot;:47,&quot;operation&quot;:&quot;+&quot;,&quot;b&quot;:9}&#x27;</text>
  <text x="52" y="246" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">}]</text>
  <text x="44" y="290" font-size="12" fill="#111827">It decides which tool and which</text>
  <text x="44" y="308" font-size="12" fill="#111827">arguments. Then it stops and waits.</text>
  <text x="44" y="336" font-size="12" fill="#6b7280">It never sees the Python function.</text>
  <rect x="354" y="80" width="132" height="280" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="420" y="106" font-size="15" fill="#374151" font-weight="700" text-anchor="middle">OpenAI API</text>
  <text x="420" y="125" font-size="12" fill="#6b7280" text-anchor="middle">carries text</text>
  <text x="420" y="141" font-size="12" fill="#6b7280" text-anchor="middle">both ways,</text>
  <text x="420" y="157" font-size="12" fill="#6b7280" text-anchor="middle">runs nothing</text>
  <rect x="516" y="80" width="360" height="280" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.35"/>
  <text x="536" y="106" font-size="15" fill="#15803d" font-weight="700">Our Python</text>
  <text x="536" y="125" font-size="12" fill="#6b7280">TutorAgent + dispatch, on your machine</text>
  <circle cx="546" cy="156" r="10" fill="#15803d"/>
  <text x="546" y="160" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="564" y="160" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">msg.tool_calls is not empty</text>
  <text x="564" y="177" font-size="11.5" fill="#6b7280">so this is a note, not an answer</text>
  <circle cx="546" cy="206" r="10" fill="#15803d"/>
  <text x="546" y="210" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="564" y="210" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">_DISPATCH[&quot;solve_with_shortcut&quot;]</text>
  <text x="564" y="227" font-size="11.5" fill="#6b7280">the name string becomes a function</text>
  <circle cx="546" cy="256" r="10" fill="#15803d"/>
  <text x="546" y="260" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="564" y="260" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">solve_with_shortcut(a=47, op=ADD, b=9)</text>
  <text x="564" y="277" font-size="11.5" fill="#6b7280">the only moment a tool actually runs</text>
  <circle cx="546" cy="306" r="10" fill="#15803d"/>
  <text x="546" y="310" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="564" y="310" font-size="11.5" fill="#111827" font-family="Consolas, Menlo, monospace" xml:space="preserve">{&quot;role&quot;: &quot;tool&quot;, ... &quot;answer&quot;: 56}</text>
  <text x="564" y="327" font-size="11.5" fill="#6b7280">appended to the transcript</text>
  <line x1="310" y1="200" x2="528" y2="200" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="420" y="192" font-size="12" fill="#111827" font-weight="600" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">the note</text>
  <line x1="514" y1="312" x2="328" y2="312" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="420" y="304" font-size="12" fill="#111827" font-weight="600" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">next request</text>
  <text x="420" y="332" font-size="11" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(result inside)</text>
</svg>
