<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="610" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#111827">One question, end to end</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">What happens between typing &quot;What is 47 + 9?&quot; and reading 56. Time runs downward; the numbers are the stages in this post.</text>
  <line x1="120" y1="124" x2="120" y2="592" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="25" y="76" width="190" height="48" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-opacity="0.35"/>
  <text x="120" y="97" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">You + Streamlit UI</text>
  <text x="120" y="115" font-size="11" fill="#6b7280" text-anchor="middle">app.py</text>
  <line x1="340" y1="124" x2="340" y2="592" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="245" y="76" width="190" height="48" rx="10" fill="#f3f4f6" stroke="#374151" stroke-opacity="0.35"/>
  <text x="340" y="97" font-size="14" fill="#374151" font-weight="700" text-anchor="middle">TutorAgent, our loop</text>
  <text x="340" y="115" font-size="11" fill="#6b7280" text-anchor="middle">agent/workflow.py</text>
  <line x1="560" y1="124" x2="560" y2="592" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="465" y="76" width="190" height="48" rx="10" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/>
  <text x="560" y="97" font-size="14" fill="#b45309" font-weight="700" text-anchor="middle">The model</text>
  <text x="560" y="115" font-size="11" fill="#6b7280" text-anchor="middle">OpenAI API, gpt-4.1-mini</text>
  <line x1="780" y1="124" x2="780" y2="592" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="685" y="76" width="190" height="48" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.35"/>
  <text x="780" y="97" font-size="14" fill="#15803d" font-weight="700" text-anchor="middle">Tools, our Python</text>
  <text x="780" y="115" font-size="11" fill="#6b7280" text-anchor="middle">tools.py, registry, techniques</text>
  <line x1="120" y1="160" x2="334" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="230.0" y="152" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&quot;What is 47 + 9?&quot; appended to messages</text>
  <circle cx="93.16" cy="148" r="10" fill="#111827"/>
  <text x="93.16" y="152" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="340" y1="212" x2="554" y2="212" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="204" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">system prompt + transcript + tool menu</text>
  <circle cx="313.15999999999997" cy="200" r="10" fill="#111827"/>
  <text x="313.15999999999997" y="204" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="560" y1="264" x2="346" y2="264" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="450.0" y="256" font-size="11.5" fill="#111827" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">solve_with_shortcut(47, &quot;+&quot;, 9)</text>
  <circle cx="331.9697" cy="252" r="10" fill="#111827"/>
  <text x="331.9697" y="256" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="450" y="282" font-size="11" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a note, not a result</text>
  <line x1="340" y1="324" x2="774" y2="324" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560.0" y="316" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">dispatch(name, arguments)</text>
  <circle cx="464.5" cy="312" r="10" fill="#111827"/>
  <text x="464.5" y="316" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="676" y="346" width="208" height="82" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.5"/>
  <circle cx="664" cy="358" r="10" fill="#111827"/>
  <text x="664" y="362" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="690" y="368" font-size="12" fill="#15803d" font-weight="600">pick add_nines (priority 10)</text>
  <text x="690" y="389" font-size="12" fill="#111827">47 + 10 = 57, then 57 − 1 = 56</text>
  <text x="690" y="410" font-size="12" fill="#111827">check: 47 + 9 = 56  ✓ verified</text>
  <line x1="780" y1="452" x2="346" y2="452" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560.0" y="444" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">result JSON, appended as a tool message</text>
  <line x1="340" y1="500" x2="554" y2="500" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="492" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">everything again, now with the result</text>
  <circle cx="316.34" cy="488" r="10" fill="#111827"/>
  <text x="316.34" y="492" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <line x1="560" y1="548" x2="346" y2="548" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="540" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">plain text: rule, steps, 56 (no note)</text>
  <line x1="340" y1="584" x2="126" y2="584" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="230.0" y="576" font-size="12" fill="#111827" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">answer shown, turn logged</text>
</svg>
